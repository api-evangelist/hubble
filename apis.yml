aid: hubble
name: Hubble
description: Hubble (hubblehq.com) is the UK's largest flexible-workspace marketplace, connecting
  businesses with private offices, coworking desks, day offices, meeting rooms, and on-demand
  workspace across thousands of buildings in the UK and beyond. Founded in 2014 by Tushar
  Agarwal and Tom Watson, the platform lets companies configure, deliver, and manage all their
  space in one place on flexible one-to-24-plus-month terms, and was acquired by Yardi in
  January 2025. Hubble runs a consumer-facing web platform and internal backend API rather
  than a published public developer API; this API Evangelist profile tracks its public web,
  security, and discovery surface.
